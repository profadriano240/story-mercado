<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"><style>
:root{--brand:#0f3d2e;--verde:#3ccf82;--queda:#ff8f7a}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#000}
.s{position:relative;overflow:hidden;width:1080px;height:1920px;background:var(--brand);color:#fff}
.box{position:absolute;left:72px;right:72px;top:300px}
.top{font-size:34px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--verde)}
h1{font-size:92px;font-weight:900;line-height:1.06;margin:20px 0 64px}
.l{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:34px 0;border-top:2px solid rgba(255,255,255,.18)}
.n{font-size:48px;font-weight:600}.n small{display:block;font-size:28px;font-weight:400;opacity:.72;margin-top:6px}
.v{text-align:right;font-size:60px;font-weight:900;white-space:nowrap}
.v span{display:block;font-size:42px;font-weight:800;margin-top:4px}
.up{color:var(--verde)}.dn{color:var(--queda)}
.ft{position:absolute;left:72px;right:72px;top:1490px;display:flex;align-items:center;gap:18px;font-size:30px;font-weight:800}
.ft img{width:60px;height:60px}.fonte{position:absolute;left:72px;right:72px;top:1572px;font-size:26px;opacity:.72}
</style></head><body><section class="s"><div class="box">
<div class="top">Mercado agora · {{DATA}}</div>
<h1>{{TITULO}}</h1>
{{LINHAS}}
</div>
<div class="ft"><img src="{{LOGO}}" alt="">impostodabolsa.com.br</div>
<div class="fonte">Dados às {{HORA}}. Fontes: Yahoo Finance e Bolsa de Dalian.</div>
</section></body></html>
