name: Story de mercado
on:
  schedule:
    - cron: "30 10 * * 1-5" # 7h30 em Brasília (UTC-3), seg-sex; reserva do disparo externo (cron-job.org)
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar no Instagram
        type: boolean
        default: false
permissions:
  contents: write
concurrency: story
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Checar token e pregão
        id: checa
        env:
          TEM_TOKEN: ${{ secrets.IG_ACCESS_TOKEN != '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$TEM_TOKEN" != true ]; then
            echo "::notice::Sem o secret IG_ACCESS_TOKEN: agendamento pulado."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git log -30 --format=%s | grep -qx "Story $(TZ=America/Sao_Paulo date +%F)"; then
            echo "::notice::Story de hoje já foi publicado: nada a fazer."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! python3 story.py pregao; then
            echo "::notice::Hoje não tem pregão na B3: sem Story."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "seguir=sim" >> "$GITHUB_OUTPUT"
      - if: steps.checa.outputs.seguir == 'sim'
        run: pip install -q pillow
      - if: steps.checa.outputs.seguir == 'sim'
        run: python3 story.py gerar
      - name: Guardar imagem pública
        id: imagem
        if: steps.checa.outputs.seguir == 'sim'
        run: |
          [ -n "$(git status --porcelain saida/story.jpg)" ] || { echo "tem=nao" >> "$GITHUB_OUTPUT"; exit 0; }
          git config user.name story-bot
          git config user.email story-bot@users.noreply.github.com
          git add saida/story.jpg
          git commit -qm "Story $(TZ=America/Sao_Paulo date +%F)"
          git push -q
          echo "tem=sim" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)/saida/story.jpg" >> "$GITHUB_OUTPUT"
      - name: Publicar
        if: steps.imagem.outputs.tem == 'sim' && (github.event_name == 'schedule' || inputs.publicar)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python3 story.py publicar "${{ steps.imagem.outputs.url }}"
